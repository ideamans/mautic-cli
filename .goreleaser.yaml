version: 2
project_name: mautic-cli

before:
  hooks:
    - go mod tidy

builds:
  - id: mautic
    main: ./cmd/mautic
    binary: mautic
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/ideamans/mautic-cli/cmd.version={{.Version}}
      - -X github.com/ideamans/mautic-cli/cmd.commit={{.Commit}}
      - -X github.com/ideamans/mautic-cli/cmd.date={{.Date}}

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "Merge pull request"
      - "Merge branch"

release:
  draft: false
  prerelease: auto
